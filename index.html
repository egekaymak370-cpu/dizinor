<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0f" />
<title>StreamFlix</title>

<style>
:root{
  --bg:#09090b;
  --surface:#141418;
  --surface2:#1d1d23;
  --text:#f7f7f8;
  --muted:#a6a6b0;
  --accent:#e50914;
  --accent2:#ff3340;
  --border:rgba(255,255,255,.09);
  --shadow:0 15px 50px rgba(0,0,0,.45);
  --radius:18px;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

body{
  min-height:100vh;
  overflow-x:hidden
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

img{
  display:block;
  max-width:100%
}

a{
  color:inherit;
  text-decoration:none
}

.hidden{
  display:none!important
}

.app{
  min-height:100vh;
  background:
    radial-gradient(
      900px 500px at 80% -10%,
      rgba(229,9,20,.17),
      transparent 60%
    ),
    linear-gradient(
      180deg,
      #09090b 0%,
      #0a0a0d 55%,
      #08080a 100%
    );
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.93),
      rgba(0,0,0,.65),
      transparent
    );
  padding:16px 22px 18px;
  backdrop-filter:blur(10px)
}

.topbar-inner{
  display:flex;
  align-items:center;
  gap:18px;
  max-width:1400px;
  margin:auto
}

.logo{
  font-weight:900;
  font-size:25px;
  letter-spacing:-1px;
  color:var(--accent)
}

.logo span{
  color:#fff
}

.toplinks{
  display:flex;
  gap:16px;
  font-size:14px;
  color:#d8d8dc
}

.toplinks button{
  background:none;
  color:inherit
}

.toplinks button.active{
  color:#fff;
  font-weight:800
}

.spacer{
  flex:1
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#fff;
  display:grid;
  place-items:center
}

.profile-btn{
  display:flex;
  gap:9px;
  align-items:center;
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:999px;
  padding:6px 10px 6px 6px
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#444,#1a1a1f);
  font-weight:800
}

.hero{
  max-width:1400px;
  margin:-10px auto 0;
  position:relative;
  border-radius:0 0 28px 28px;
  min-height:470px;
  overflow:hidden
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  position:absolute;
  inset:0;
  filter:saturate(1.1)
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.92) 0%,
      rgba(0,0,0,.58) 40%,
      rgba(0,0,0,.12) 75%,
      rgba(0,0,0,.45) 100%
    ),
    linear-gradient(
      0deg,
      #09090b 0%,
      transparent 45%,
      rgba(0,0,0,.15)
    );
}

.hero-content{
  position:relative;
  z-index:1;
  max-width:620px;
  padding:100px 48px 65px
}

.kicker{
  display:inline-flex;
  gap:8px;
  align-items:center;
  background:rgba(255,255,255,.09);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px
}

.hero h1{
  font-size:clamp(40px,7vw,76px);
  line-height:.95;
  margin:18px 0 12px;
  letter-spacing:-2px
}

.hero p{
  font-size:16px;
  line-height:1.55;
  color:#ddd;
  max-width:580px
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:24px
}

.primary,
.secondary{
  padding:12px 18px;
  border-radius:10px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:8px
}

.primary{
  background:#fff;
  color:#080808
}

.secondary{
  background:rgba(255,255,255,.13);
  color:#fff;
  border:1px solid rgba(255,255,255,.08)
}

.section{
  max-width:1400px;
  margin:30px auto 0;
  padding:0 20px
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px
}

.section h2{
  font-size:22px;
  margin:0;
  letter-spacing:-.5px
}

.section small{
  color:var(--muted)
}

.rail{
  display:flex;
  gap:12px;
  overflow:auto;
  padding:3px 2px 10px;
  scroll-snap-type:x proximity
}

.rail::-webkit-scrollbar{
  display:none
}

.card{
  min-width:160px;
  width:160px;
  background:#121217;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  scroll-snap-align:start;
  box-shadow:0 5px 16px rgba(0,0,0,.2);
  transition:.2s transform,.2s border-color
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.2)
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover
}

.card-body{
  padding:10px
}

.card-title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.card-meta{
  color:var(--muted);
  font-size:11px;
  margin-top:5px
}

.badge{
  display:inline-flex;
  padding:3px 6px;
  border-radius:6px;
  font-size:10px;
  font-weight:800;
  background:var(--accent);
  color:#fff
}

.resume{
  position:relative
}

.resume img{
  aspect-ratio:16/9
}

.resume .progress{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:4px;
  background:rgba(255,255,255,.2)
}

.resume .progress i{
  display:block;
  height:100%;
  background:var(--accent)
}

.bottomnav{
  position:fixed;
  left:50%;
  bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:50;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border:1px solid var(--border);
  background:rgba(25,25,30,.9);
  backdrop-filter:blur(14px);
  border-radius:22px;
  box-shadow:var(--shadow)
}

.navitem{
  min-width:68px;
  padding:7px 8px;
  background:transparent;
  color:#a8a8b0;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px
}

.navitem .ico{
  font-size:19px
}

.navitem.active{
  background:rgba(255,255,255,.09);
  color:#fff
}

.nav-search{
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:22px;
  box-shadow:0 0 0 5px rgba(229,9,20,.13)
}

.page{
  max-width:1400px;
  margin:0 auto;
  padding:18px 20px 110px
}

.panel{
  background:rgba(20,20,24,.85);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow)
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px
}

.grid .card{
  width:auto;
  min-width:0
}

.input,
.select,
.textarea{
  width:100%;
  background:#0f0f13;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 12px;
  color:#fff;
  outline:none
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--accent)
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px
}

.form-grid .full{
  grid-column:1/-1
}

.label{
  display:block;
  font-size:12px;
  color:#aaa;
  margin:0 0 6px
}

.searchbar{
  display:flex;
  gap:10px;
  margin:6px 0 18px
}

.searchbar .input{
  flex:1
}

.tabbar{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:18px
}

.tab{
  padding:9px 13px;
  background:#15151a;
  color:#c7c7cc;
  border:1px solid var(--border);
  border-radius:999px;
  white-space:nowrap
}

.tab.active{
  background:#fff;
  color:#111
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:grid;
  place-items:center;
  padding:14px
}

.modal{
  width:min(980px,100%);
  max-height:92vh;
  overflow:auto;
  background:#101014;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow)
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid var(--border)
}

.modal-body{
  padding:16px
}

.close{
  background:rgba(255,255,255,.08);
  color:#fff;
  width:36px;
  height:36px;
  border-radius:50%
}

.detail{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:22px
}

.detail img{
  width:100%;
  border-radius:14px;
  aspect-ratio:2/3;
  object-fit:cover
}

.detail h1{
  margin:0 0 8px;
  font-size:clamp(32px,5vw,52px)
}

.meta-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  color:#d6d6db;
  font-size:13px;
  margin:10px 0
}

.description{
  color:#c4c4ca;
  line-height:1.6
}

.tag{
  background:#1a1a20;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  border:1px solid var(--border)
}

.comment-list{
  display:grid;
  gap:10px;
  margin-top:12px
}

.comment{
  padding:10px;
  background:#17171c;
  border:1px solid var(--border);
  border-radius:12px
}

.comment strong{
  font-size:13px
}

.comment p{
  margin:5px 0 0;
  color:#ddd;
  font-size:13px
}

.split{
  display:grid;
  grid-template-columns:310px 1fr;
  gap:14px
}

.chat-list{
  display:grid;
  gap:6px;
  max-height:60vh;
  overflow:auto
}

.chat-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  background:transparent;
  color:#fff
}

.chat-user.active{
  background:#1a1a20
}

.messages{
  height:48vh;
  overflow:auto;
  background:#0d0d10;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:9px
}

.msg{
  max-width:78%;
  padding:9px 11px;
  border-radius:14px;
  background:#1b1b21
}

.msg.me{
  margin-left:auto;
  background:var(--accent)
}

.msg small{
  display:block;
  opacity:.7;
  font-size:9px;
  margin-top:4px
}

.reel-wrap{
  display:grid;
  place-items:center;
  min-height:70vh
}

.reel{
  position:relative;
  width:min(430px,92vw);
  height:min(76vh,760px);
  background:#08080b;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:var(--shadow)
}

.reel video,
.reel img{
  width:100%;
  height:100%;
  object-fit:cover
}

.reel::after{
  content:"";
  position:absolute;
  inset:45% 0 0;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  )
}

.reel-info{
  position:absolute;
  z-index:2;
  left:16px;
  right:78px;
  bottom:18px
}

.reel-actions{
  position:absolute;
  z-index:3;
  right:12px;
  bottom:20px;
  display:grid;
  gap:10px
}

.reel-act{
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  color:#fff;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.12)
}

.reel-nav{
  display:flex;
  gap:10px;
  margin-top:10px;
  justify-content:center
}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.kpi{
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#15151a
}

.kpi b{
  font-size:28px;
  display:block
}

.kpi span{
  color:var(--muted);
  font-size:12px
}

.table-wrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:12px
}

.table th{
  color:#aaa
}

.profile-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:22px;
  background:
    radial-gradient(
      500px 300px at 50% 15%,
      rgba(229,9,20,.17),
      transparent 60%
    ),
    #08080a
}

.profile-box{
  width:min(1020px,100%);
  text-align:center
}

.profile-box h1{
  font-size:32px;
  margin-bottom:8px
}

.profile-box p{
  color:#aaa
}

.profiles{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin:28px 0
}

.profile-card{
  width:150px;
  padding:12px;
  background:#131318;
  border:1px solid var(--border);
  border-radius:18px;
  color:#fff
}

.profile-card:hover{
  border-color:rgba(255,255,255,.25);
  transform:translateY(-3px)
}

.profile-icon{
  width:92px;
  height:92px;
  border-radius:18px;
  margin:auto auto 10px;
  display:grid;
  place-items:center;
  font-size:38px;
  background:linear-gradient(135deg,#444,#1c1c20)
}

.profile-card small{
  display:block;
  color:#aaa;
  margin-top:4px
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(
      500px 300px at 50% 0%,
      rgba(229,9,20,.22),
      transparent 65%
    ),
    #08080a
}

.auth-card{
  width:min(430px,100%);
  background:#111116;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px
}

.auth-card h1{
  margin:0 0 4px
}

.auth-card p{
  color:#aaa;
  margin:0 0 18px
}

.auth-tabs{
  display:flex;
  gap:6px;
  margin-bottom:14px
}

.auth-tab{
  flex:1;
  padding:9px;
  border-radius:10px;
  background:#17171c;
  color:#aaa
}

.auth-tab.active{
  background:#fff;
  color:#111
}

.toast{
  position:fixed;
  right:15px;
  bottom:95px;
  z-index:200;
  background:#1b1b21;
  border:1px solid var(--border);
  padding:11px 13px;
  border-radius:12px;
  box-shadow:var(--shadow);
  max-width:320px
}

.danger{
  background:#6d151a!important
}

.success{
  background:#16451f!important
}

.muted{
  color:var(--muted)
}

@media(max-width:850px){

  .toplinks{
    display:none
  }

  .hero{
    min-height:420px;
    border-radius:0 0 20px 20px
  }

  .hero-content{
    padding:80px 24px 50px
  }

  .detail{
    grid-template-columns:1fr
  }

  .detail img{
    max-width:210px
  }

  .split{
    grid-template-columns:1fr
  }

  .chat-list{
    display:flex;
    overflow:auto
  }

  .chat-user{
    min-width:180px
  }

  .kpis{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:520px){

  .topbar{
    padding:11px 14px
  }

  .topbar-inner{
    gap:10px
  }

  .logo{
    font-size:22px
  }

  .profile-btn{
    display:none
  }

  .section{
    padding:0 14px
  }

  .page{
    padding:14px 14px 120px
  }

  .card{
    min-width:145px;
    width:145px
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .form-grid .full{
    grid-column:auto
  }

  .bottomnav{
    width:calc(100% - 18px);
    justify-content:space-around
  }

  .navitem{
    min-width:0;
    flex:1
  }

  .nav-search{
    width:50px;
    height:50px
  }

  .hero h1{
    font-size:46px
  }

  .hero p{
    font-size:14px
  }

  .hero-content{
    padding:60px 18px 42px
  }
}

</style>
</head>

                  "

                  <div class="avatar">
                    ${esc(
                      x.name?.[0] || "U"
                    )}
                  </div>

                  <div>

                    <b>
                      ${esc(x.name)}
                    </b>

                    <div
                      class="muted"
                      style="font-size:11px"
                    >
                      ${esc(x.email)}
                    </div>

                  </div>

                </div>

                <div class="actions">

                  <button
                    class="secondary"
                    data-chat="${x.id}"
                  >
                    Mesaj
                  </button>

                  <button
                    class="secondary"
                    data-report="${x.id}"
                  >
                    Şikayet
                  </button>

                </div>

              </div>
            `).join("") ||
            `
              <div class="panel muted">
                Henüz arkadaşın yok.
                Arama bölümünden kullanıcı bulabilirsin.
              </div>
            `
          }

        </div>

      </div>

    </div>
  `;
}


function wireFriends(){

  document
    .querySelectorAll("[data-accept]")
    .forEach(
      b =>
        b.onclick = () =>
          acceptFriend(
            b.dataset.accept
          )
    );

  document
    .querySelectorAll("[data-chat]")
    .forEach(
      b =>
        b.onclick = () => {
          selectedChatUser =
            b.dataset.chat;

          currentSection = "chat";

          renderApp();
        }
    );

  document
    .querySelectorAll("[data-report]")
    .forEach(
      b =>
        b.onclick = () =>
          reportUser(
            b.dataset.report
          )
    );
}


function reportUser(id){

  const reason = prompt(
    "Şikayet nedeni?\nTaciz / zorbalık / spam / diğer"
  );

  if(!reason) return;

  db.reports.push({
    id: uid(),
    type: "user",
    targetId: id,
    reporter: session.userId,
    reason,
    text: "",
    status: "open",
    createdAt: now()
  });

  saveDB();

  toast(
    "Şikayet admin paneline gönderildi",
    "success"
  );
}
