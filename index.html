<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>StreamFlix</title>

<style>
:root{
  --bg:#08080b;
  --card:#15151a;
  --card2:#1d1d23;
  --text:#fff;
  --muted:#a5a5ad;
  --red:#e50914;
  --red2:#ff3340;
  --border:rgba(255,255,255,.09);
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

/* AUTH */

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(229,9,20,.25),
      transparent 40%
    ),
    #08080b;
}

.auth-box{
  width:min(420px,100%);
  background:#111116;
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px;
  box-shadow:0 20px 80px rgba(0,0,0,.6);
}

.logo{
  color:var(--red);
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.auth h1{
  margin:25px 0 8px;
}

.auth p{
  color:var(--muted);
}

.field{
  margin-top:14px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:6px;
}

.input,
.select,
.textarea{
  width:100%;
  padding:12px;
  color:#fff;
  background:#0c0c10;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:var(--red);
}

.btn{
  padding:12px 18px;
  border-radius:10px;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-red{
  background:var(--red);
  color:#fff;
}

.btn-white{
  background:#fff;
  color:#111;
}

.btn-dark{
  background:#29292f;
  color:#fff;
}

.btn-danger{
  background:#7b1219;
  color:#fff;
}

/* PROFILE */

.profile-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(229,9,20,.2),
      transparent 45%
    ),
    #08080b;
}

.profile-box{
  width:min(950px,100%);
  text-align:center;
}

.profile-box h1{
  font-size:32px;
}

.profile-box p{
  color:var(--muted);
}

.profiles{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:30px;
}

.profile{
  width:160px;
  padding:15px;
  border-radius:18px;
  background:#15151a;
  border:1px solid var(--border);
  color:#fff;
  transition:.2s;
}

.profile:hover{
  transform:translateY(-5px);
  border-color:#555;
}

.profile-icon{
  width:95px;
  height:95px;
  margin:auto;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:linear-gradient(135deg,#444,#17171c);
}

.profile small{
  display:block;
  margin-top:10px;
  color:#999;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(5,5,7,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.05);
}

.header-inner{
  max-width:1450px;
  margin:auto;
  height:64px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:25px;
}

.brand{
  color:var(--red);
  font-size:24px;
  font-weight:900;
}

.brand span{
  color:#fff;
}

.header-links{
  display:flex;
  gap:18px;
}

.header-links button{
  color:#aaa;
  background:none;
}

.header-links button.active{
  color:#fff;
  font-weight:800;
}

.header-spacer{
  flex:1;
}

.user-mini{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 10px 5px 5px;
  background:#1c1c21;
  color:#fff;
  border-radius:30px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#444,#111);
  font-weight:bold;
}

/* HERO */

.hero{
  position:relative;
  max-width:1450px;
  min-height:500px;
  margin:auto;
  overflow:hidden;
}

.hero-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.95),
      rgba(0,0,0,.55) 45%,
      rgba(0,0,0,.1)
    ),
    linear-gradient(
      0deg,
      #08080b,
      transparent 45%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:650px;
  padding:130px 35px 70px;
}

.hero-tag{
  display:inline-block;
  padding:6px 10px;
  background:rgba(255,255,255,.1);
  border-radius:20px;
  font-size:12px;
}

.hero h1{
  font-size:clamp(42px,7vw,75px);
  margin:18px 0 10px;
}

.hero p{
  color:#ddd;
  line-height:1.6;
}

/* CONTENT */

.page{
  max-width:1450px;
  margin:auto;
  padding:25px 20px 120px;
}

.section{
  margin-top:30px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.section-title h2{
  margin:0;
}

.muted{
  color:var(--muted);
}

.rail{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
}

.rail::-webkit-scrollbar{
  display:none;
}

.card{
  flex:0 0 165px;
  background:#141419;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#555;
}

.card img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.card-title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  color:#999;
  font-size:11px;
  margin-top:5px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
}

.grid .card{
  width:auto;
  min-width:0;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:5px;
  padding:7px;
  background:rgba(25,25,30,.94);
  border:1px solid var(--border);
  border-radius:22px;
  backdrop-filter:blur(15px);
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.nav-btn{
  min-width:68px;
  padding:7px;
  border-radius:14px;
  background:none;
  color:#999;
}

.nav-btn.active{
  color:#fff;
  background:#29292f;
}

.nav-icon{
  font-size:19px;
  display:block;
}

.search-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  font-size:22px;
}

/* PANELS */

.panel{
  background:#141419;
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

/* SEARCH */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

/* DETAILS */

.detail{
  display:grid;
  grid-template-columns:250px 1fr;
  gap:25px;
}

.detail-poster{
  width:100%;
  border-radius:15px;
}

.detail h1{
  font-size:45px;
  margin-top:0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tag{
  background:#25252b;
  border-radius:8px;
  padding:7px 10px;
  font-size:12px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  z-index:500;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

.modal{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:#111116;
  border:1px solid var(--border);
  border-radius:20px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px;
  border-bottom:1px solid var(--border);
}

.modal-body{
  padding:18px;
}

.close{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#29292f;
  color:#fff;
}

/* PLAYER */

.player{
  background:#000;
  width:100%;
  max-height:70vh;
  border-radius:14px;
}

.player-info{
  padding:15px 0;
}

/* REELS */

.reels{
  min-height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.reel{
  position:relative;
  width:min(430px,94vw);
  height:min(75vh,760px);
  border-radius:20px;
  overflow:hidden;
  background:#000;
}

.reel img,
.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reel-gradient{
  position:absolute;
  inset:45% 0 0;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
}

.reel-info{
  position:absolute;
  left:15px;
  bottom:20px;
  right:80px;
  z-index:5;
}

.reel-actions{
  position:absolute;
  right:12px;
  bottom:20px;
  z-index:5;
  display:grid;
  gap:10px;
}

.reel-action{
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:20px;
}

/* CHAT */

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:15px;
}

.chat-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.chat-user{
  padding:12px;
  border-radius:12px;
  background:none;
  color:#fff;
  text-align:left;
}

.chat-user:hover,
.chat-user.active{
  background:#25252b;
}

.messages{
  height:55vh;
  overflow:auto;
  background:#0c0c10;
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
}

.message{
  max-width:75%;
  padding:10px 13px;
  margin-bottom:9px;
  border-radius:14px;
  background:#202027;
}

.message.me{
  margin-left:auto;
  background:var(--red);
}

/* ADMIN */

.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.kpi{
  background:#1a1a20;
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
}

.kpi strong{
  display:block;
  font-size:28px;
}

.kpi span{
  color:#999;
  font-size:12px;
}

.admin-list{
  margin-top:20px;
}

.admin-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

/* TOAST */

.toast{
  position:fixed;
  z-index:1000;
  right:15px;
  bottom:90px;
  max-width:320px;
  padding:13px 15px;
  background:#24242a;
  border:1px solid var(--border);
  border-radius:12px;
}

/* MOBILE */

@media(max-width:800px){

  .header-links{
    display:none;
  }

  .header-inner{
    padding:0 14px;
  }

  .hero{
    min-height:470px;
  }

  .hero-content{
    padding:120px 20px 50px;
  }

  .detail{
    grid-template-columns:1fr;
  }

  .detail-poster{
    width:180px;
  }

  .chat-layout{
    grid-template-columns:1fr;
  }

  .chat-list{
    flex-direction:row;
    overflow-x:auto;
  }

  .chat-user{
    min-width:160px;
  }

  .kpis{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){

  .page{
    padding:18px 14px 120px;
  }

  .card{
    flex-basis:145px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .bottom-nav{
    width:calc(100% - 14px);
  }

  .nav-btn{
    min-width:0;
    flex:1;
  }

  .hero h1{
    font-size:45px;
  }

  .kpis{
    grid-template-columns:1fr 1fr;
  }

  .user-mini span{
    display:none;
  }
}
</style>
</head>

    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function toast(text){

function addFriend(userId){

  const u=currentUser();

  if(!u.friends){
    u.friends=[];
  }

  if(u.friends.includes(userId)){
    toast("Zaten arkadaşsınız.");
    return;
  }

  u.friends.push(userId);

  const other=
    db.users.find(
      x=>x.id===userId
    );

  if(other){

    if(!other.requests){
      other.requests=[];
    }

    if(!other.requests.includes(u.id)){
      other.requests.push(u.id);
    }

  }

  saveDB();

  toast("Arkadaş isteği gönderildi.");
}

function openChat(userId){

function renderChat(){

  const u=currentUser();

  const friends=
    (u.friends||[])
      .map(id=>
        db.users.find(
          x=>x.id===id
        )
      )
      .filter(Boolean);

  if(!selectedChat && friends.length){
    selectedChat=friends[0].id;
  }

  const partner=
    db.users.find(
      x=>x.id===selectedChat
    );

  const messages=
    partner
    ?
    db.messages.filter(m=>
      (
        m.from===u.id &&
        m.to===partner.id
      ) ||
      (
        m.from===partner.id &&
        m.to===u.id
      )
    )
    :
    [];

  return `
    <div class="page">

      <h1>Sohbet</h1>

      <div class="chat-layout">

        <div class="panel">

          <h3>Arkadaşlar</h3>

          <div class="chat-list">

            ${
              friends.length
              ?
              friends.map(x=>`

                <button
                  class="chat-user ${
                    selectedChat===x.id
                    ?"active"
                    :""
                  }"
                  onclick="openChat('${x.id}')"
                >
                  👤
                  ${escapeHTML(x.name)}
                </button>

              `).join("")
              :
              `
                <div class="muted">
                  Önce arkadaş ekle.
                </div>
              `
            }

          </div>

        </div>

        <div class="panel">

          ${
            partner
            ?
            `

              <h3>
                ${escapeHTML(partner.name)}
              </h3>

              <div class="messages">

                ${
                  messages.length
                  ?
                  messages.map(m=>`

                    <div
                      class="message ${
                        m.from===u.id
                        ?"me"
                        :""
                      }"
                    >
                      ${escapeHTML(m.text)}
                    </div>

                  `).join("")
                  :
                  `<div class="muted">
                    Henüz mesaj yok.
                  </div>`
                }

              </div>

              <div
                style="
                  display:flex;
                  gap:8px;
                  margin-top:10px;
                "
              >

                <input
                  id="chatInput"
                  class="input"
                  placeholder="Mesaj yaz..."
                  onkeydown="
                    if(event.key==='Enter'){
                      sendMessage();
                    }
                  "
                >

                <button
                  class="btn btn-red"
                  onclick="sendMessage()"
                >
                  Gönder
                </button>

              </div>

            `
            :
            `
              <div class="muted">
                Sohbet etmek için arkadaş seç.
              </div>
            `
          }

        </div>

      </div>

    </div>
  `;
}

/* =========================================
   KÜFÜR FİLTRESİ
========================================= */

const bannedWords=[
  "amk",
  "aq",
  "orospu",
  "siktir",
  "yarrak",
  "piç",
  "şerefsiz"
];

function containsBadWord(text){

  const lower=text.toLowerCase();

  return bannedWords.some(
    word=>lower.includes(word)
  );
}

function sendMessage(){

  const input=
    document.getElementById("chatInput");

  if(!input) return;

  const text=input.value.trim();

  if(!text) return;

  if(containsBadWord(text)){

    toast(
      "Mesaj gönderilemedi. Uygunsuz ifade bulundu."
    );

    return;
  }

  const u=currentUser();

  db.messages.push({
    id:id(),
    from:u.id,
    to:selectedChat,
    text,
    createdAt:Date.now()
  });

  saveDB();

  render();
}

}

function saveTheme(){

  const color=
    document.getElementById("accentColor")
      .value;

  db.settings.accent=color;

  saveDB();

  applySettings();

  toast("Tema güncellendi.");
}

function banUser(userId){

  const u=
    db.users.find(
      x=>x.id===userId
    );

  if(!u) return;

  u.banned=true;

  saveDB();

  toast(
    u.name+" banlandı."
  );

  render();
}

/* =========================================
   NAVİGASYON
========================================= */

function go(page){

  currentPage=page;

  render();
}

function nav(){

  return `
    <nav class="bottom-nav">

      <button
        class="nav-btn ${
          currentPage==="home"
          ?"active"
          :""
        }"
        onclick="go('home')"
      >
        <span class="nav-icon">⌂</span>
        Ana Sayfa
      </button>

      <button
        class="nav-btn ${
          currentPage==="friends"
          ?"active"
          :""
        }"
        onclick="go('friends')"
      >
        <span class="nav-icon">👥</span>
        Arkadaş
      </button>

      <button
        class="search-btn"
        onclick="go('search')"
      >
        🔍
      </button>

      <button
        class="nav-btn ${
          currentPage==="reels"
          ?"active"
          :""
        }"
        onclick="go('reels')"
      >
        <span class="nav-icon">▶</span>
        Reels
      </button>

      <button
        class="nav-btn ${
          currentPage==="chat"
          ?"active"
          :""
        }"
        onclick="go('chat')"
      >
        <span class="nav-icon">💬</span>
        Sohbet
      </button>

    </nav>
  `;
}

/* =========================================
   HEADER
========================================= */

function header(){

  const u=currentUser();

  return `
    <header class="header">

      <div class="header-inner">

        <button
          class="brand"
          onclick="go('home')"
        >
          ${escapeHTML(db.settings.logo)}
        </button>

        <div class="header-links">

          <button
            class="${
              currentPage==="home"
              ?"active"
              :""
            }"
            onclick="go('home')"
          >
            Ana Sayfa
          </button>

          <button
            onclick="filterType('movie')"
          >
            Film
          </button>

          <button
            onclick="filterType('series')"
          >
            Dizi
          </button>

          <button
            onclick="filterType('anime')"
          >
            Anime
          </button>

        </div>

        <div class="header-spacer"></div>

        ${
          u.role==="admin"
          ?
          `
            <button
              class="btn btn-dark"
              onclick="go('admin')"
            >
              ⚙️ Admin
            </button>
          `
          :
          ""
        }

        <button
          class="user-mini"
          onclick="goProfiles()"
        >
          <span class="avatar">
            ${escapeHTML(u.name[0])}
          </span>
          <span>
            ${escapeHTML(u.name)}
          </span>
        </button>

      </div>

    </header>
  `;
}

function goProfiles(){

  session.profile=null;

  saveSession();

  render();
}

function filterType(type){

  currentPage="category";
  window.selectedType=type;

  render();
}

function renderCategory(){

  const list=
    db.contents.filter(
      c=>c.type===window.selectedType
    );

  const names={
    movie:"Filmler",
    series:"Diziler",
    anime:"Animeler"
  };

  return `
    <div class="page">

      <h1>
        ${names[window.selectedType]}
      </h1>

      <div class="grid">
        ${list.map(contentCard).join("")}
      </div>

    </div>
  `;
}

/* =========================================
   ANA RENDER
========================================= */

function render(){

  applySettings();

  const root=
    document.getElementById("app");

  if(!session){
    root.innerHTML=renderAuth();
    return;
  }

  const u=currentUser();

  if(!u){
    logout();
    return;
  }

  if(u.banned){
    root.innerHTML=`
      <div class="auth">
        <div class="auth-box">
          <h1>Hesap engellendi</h1>
          <p>
            Bu hesap StreamFlix tarafından engellenmiştir.
          </p>
          <button
            class="btn btn-red"
            onclick="logout()"
          >
            Çıkış Yap
          </button>
        </div>
      </div>
    `;
    return;
  }

  if(!session.profile){
    root.innerHTML=renderProfiles();
    return;
  }

  let content="";

  if(currentPage==="home"){
    content=renderHome();
  }

  else if(currentPage==="search"){
    content=renderSearch();
  }

  else if(currentPage==="reels"){
    content=renderReels();
  }

  else if(currentPage==="friends"){
    content=renderFriends();
  }

  else if(currentPage==="chat"){
    content=renderChat();
  }

  else if(currentPage==="admin"){
    content=renderAdmin();
  }

  else if(currentPage==="category"){
    content=renderCategory();
  }

  root.innerHTML=
    header()+
    content+
    nav();
}

/* =========================================
   TEMA
========================================= */

function applySettings(){

  document.documentElement
    .style
    .setProperty(
      "--accent",
      db.settings.accent || "#e50914"
    );

  document.documentElement
    .style
    .setProperty(
      "--bg",
      db.settings.background || "#08080b"
    );
}

/* =========================================
   BAŞLAT
========================================= */

render();

</script>
