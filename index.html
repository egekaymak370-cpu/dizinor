<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREAMFLIX</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    min-height:100%;
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

#auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:
        radial-gradient(
            circle at 50% 20%,
            #3a1010,
            #080808 55%
        );
}

.authbox{
    width:min(410px,100%);
    background:#121212;
    padding:30px;
    border-radius:14px;
    box-shadow:0 20px 70px #000;
}

.logo{
    font-size:34px;
    font-weight:900;
    text-align:center;
    margin-bottom:28px;
}

.logo b,
.red{
    color:#e50914;
}

.authbox h2{
    text-align:center;
}

.field{
    width:100%;
    padding:14px;
    margin:7px 0;
    background:#222;
    border:1px solid #333;
    border-radius:7px;
    color:#fff;
    outline:0;
}

.field:focus{
    border-color:#e50914;
}

.btn{
    border:0;
    border-radius:7px;
    padding:13px 18px;
    font-weight:700;
}

.primary{
    background:#e50914;
    color:#fff;
}

.full{
    width:100%;
    margin-top:8px;
}

.switch{
    text-align:center;
    color:#999;
    margin-top:18px;
    font-size:14px;
}

.switch button{
    background:none;
    border:0;
    color:#fff;
    font-weight:700;
    padding:0;
}

.err{
    color:#ff8585;
    background:#360909;
    border-radius:6px;
    padding:10px;
    margin:10px 0;
    font-size:14px;
}

/* APP */

#app{
    min-height:100vh;
    padding-bottom:75px;
}

header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:#0b0b0b;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:20;
}

.headlogo{
    font-size:27px;
    font-weight:900;
}

.headright{
    display:flex;
    gap:8px;
}

.icon{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:19px;
}

.profile{
    background:#e50914;
}

/* NAV */

nav{
    display:flex;
    justify-content:center;
    gap:35px;
    background:#0b0b0b;
    border-bottom:1px solid #181818;
    padding:16px;
}

nav button,
.bottom button{
    background:none;
    border:0;
    color:#aaa;
    font-weight:700;
}

nav button.active,
.bottom button.active{
    color:#e50914;
}

/* HERO */

.hero{
    min-height:450px;
    padding:70px 7%;
    display:flex;
    align-items:center;

    background:
        linear-gradient(
            90deg,
            #050505 5%,
            #050505d9 35%,
            #05050522
        ),
        radial-gradient(
            circle at 75% 40%,
            #531414,
            #080808 55%
        );
}

.hero div{
    max-width:600px;
}

.hero h1{
    font-size:clamp(45px,8vw,78px);
    margin:8px 0 18px;
}

.hero p{
    color:#ccc;
    line-height:1.6;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.white{
    background:#fff;
    color:#000;
}

.dark{
    background:#292929;
    color:#fff;
}

/* CONTENT */

.section{
    padding:30px 5%;
}

.title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.title h2{
    margin:0;
}

.title button{
    background:none;
    border:0;
    color:#e50914;
    font-weight:700;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(145px,1fr));
    gap:15px;
}

/* CARDS */

.card{
    background:#151515;
    border-radius:9px;
    overflow:hidden;
    transition:.15s;
}

.card:hover{
    transform:translateY(-4px);
}

.poster{
    aspect-ratio:2/3;
    background:
        linear-gradient(
            145deg,
            #301010,
            #202020
        );
    display:grid;
    place-items:center;
    font-size:52px;
}

.info{
    padding:10px;
}

.name{
    font-weight:700
