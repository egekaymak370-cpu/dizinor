function now(){

function esc(value){
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function toast(message,type=""){
  const el=document.createElement("div");
  el.className="toast "+type;
  el.textContent=message;
  toastRoot.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },2600);
}

function loadDB(){

  const raw=localStorage.getItem(DB_KEY);

  if(!raw){
    const fresh=createDB();

    if(fresh.contents.length){
      fresh.settings.heroId=fresh.contents[0].id;
    }

    localStorage.setItem(

      JSON.stringify(fresh)
    );

    return fresh;
  }

    parsed.users ||= [];
    parsed.contents ||= [];
    parsed.reels ||= [];
    parsed.comments ||= [];
    parsed.messages ||= [];
    parsed.reports ||= [];
    parsed.bans ||= [];

      surface:"#141418",
      logoText:"STREAMFLIX",
      heroId:parsed.contents[0]?.id || null
    };

    return parsed;

  }catch(error){

    localStorage.removeItem(DB_KEY);

    return createDB();
  }
}

function repairAdmin(){

  let admin=db.users.find(
    u =>
      u.email &&
      u.email.toLowerCase()===ADMIN_EMAIL
  );

  if(!admin){

    admin=createAdmin();

    db.users.push(admin);

  }else{

    admin.role="admin";

    admin.profiles ||= [];

    const adminProfile=
      admin.profiles.find(
        p=>p.type==="admin"
      );

    if(!adminProfile){

      admin.profiles.unshift({
        id:uid(),
        name:"Admin",
        type:"admin",
        avatar:"🛡️"
      });

    }
  }

  saveDB();
}

/* =========================
   LOGIN
========================= */

function login(email,password){

  email=email.trim().toLowerCase();

  if(!email || !password){

    toast(
      "E-posta ve şifre gerekli.",
      "danger"
    );

    return;
  }

  const u=db.users.find(
    x =>
      x.email &&
      x.email.toLowerCase()===email &&
      x.password===password
  );

  if(!u){

    toast(
      "E-posta veya şifre hatalı.",
      "danger"
    );

    return;
  }

  if(
    u.bannedUntil &&
    u.bannedUntil>now()
  ){

    toast(
      "Hesabınız geçici olarak kısıtlandı.",
      "danger"
    );

    return;
  }

  session={
    userId:u.id
  };

  saveSession();

  activeProfile=null;

  showProfiles();
}


/* =========================
   KAYIT
========================= */

function register(name,email,password){

  name=name.trim();
  email=email.trim().toLowerCase();

  if(name.length<2){

    toast(
      "Geçerli bir isim gir.",
      "danger"
    );

    return;
  }

  if(!email.includes("@")){

    toast(
      "Geçerli bir e-posta gir.",
      "danger"
    );

    return;
  }

  if(password.length<6){

    toast(
      "Şifre en az 6 karakter olmalı.",
      "danger"
    );

    return;
  }

  const exists=db.users.some(
    u =>
      u.email &&
      u.email.toLowerCase()===email
  );

  if(exists){

    toast(
      "Bu e-posta zaten kayıtlı.",
      "danger"
    );

    return;
  }

  /*
   Normal kullanıcı hiçbir zaman
   kayıt ekranından admin olamaz.
  */

  const newUser={
    id:uid(),
    email,
    password,
    name,
    role:"user",
    bannedUntil:0,
    createdAt:now(),
    friends:[],
    pending:[],
    notifications:[],
    profiles:[
      {
        id:uid(),
        name:name,
        type:"user",
        avatar:"🙂"
      },
      {
        id:uid(),
        name:"Çocuk",
        type:"child",
        avatar:"🧒"
      }
    ]
  };

  db.users.push(newUser);

  saveDB();

  session={
    userId:newUser.id
  };

  saveSession();

  activeProfile=null;

  toast(
    "Hesabın oluşturuldu.",
    "success"
  );

  showProfiles();
}
