<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAnime +18 Veritabanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-zoom:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="film" class="text-red-500 w-7 h-7"></i>
                <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent">CineAnime</span>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Anime, film veya dizi ara..." 
                           class="w-full bg-slate-800 border border-slate-700 rounded-full py-2 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-red-500">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                </div>
            </div>

            <!-- Adult Content Switcher -->
            <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <i data-lucide="shield-alert" class="w-4 h-4 text-amber-500"></i>
                <span class="text-xs font-semibold">+18 Yetişkin Filtresi</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="adult-toggle" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
                </label>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1">
        
        <!-- Category Selector -->
        <div class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
            <button onclick="fetchTrending('all')" class="bg-red-600 hover:bg-red-700 text-xs font-bold px-4 py-2 rounded-lg transition">Popüler / Trendler</button>
            <button onclick="fetchTrending('movie')" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition">Filmler</button>
            <button onclick="fetchTrending('tv')" class="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-4 py-2 rounded-lg transition">Diziler</button>
            <button onclick="fetchAnime()" class="bg-purple-600 hover:bg-purple-700 text-xs font-bold px-4 py-2 rounded-lg transition">Animeler</button>
        </div>

        <!-- Grid Container -->
        <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Loading placeholder -->
            <div class="col-span-full text-center py-12 text-slate-500">İçerikler yükleniyor...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        TMDB Açık Kaynak Veritabanı API ile desteklenmektedir.
    </footer>

    <script>
        lucide.createIcons();
        
        // Demo API key (TMDB Public Read Key)
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_PATH = 'https://image.tmdb.org/t/p/w500';

        let includeAdult = false;

        document.getElementById('adult-toggle').addEventListener('change', (e) => {
            includeAdult = e.target.checked;
            alert(includeAdult ? "+18 İçerik arama filtresi açıldı." : "+18 İçerik filtresi kapatıldı.");
        });

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                if (query) searchMedia(query);
            }
        });

        async function fetchTrending(type = 'all') {
            try {
                const res = await fetch(`${BASE_URL}/trending/${type}/day?api_key=${API_KEY}&language=tr-TR&include_adult=${includeAdult}`);
                const data = await res.json();
                renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchAnime() {
            try {
                const res = await fetch(`${BASE_URL}/discover/tv?api_key=${API_KEY}&with_keywords=210024&language=tr-TR&include_adult=${includeAdult}`);
                const data = await res.json();
                renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        async function searchMedia(query) {
            try {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=tr-TR&include_adult=${includeAdult}`);
                const data = await res.json();
                renderCards(data.results);
            } catch (err) {
                console.error(err);
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">Sonuç bulunamadı.</div>';
                return;
            }

            items.forEach(item => {
                if (!item.poster_path) return;

                const title = item.title || item.name || 'İsimsiz';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const date = item.release_date || item.first_air_date || 'Bilinmiyor';

                const card = document.createElement('div');
                card.className = 'bg-slate-800 rounded-xl overflow-hidden border border-slate-700 card-zoom transition duration-300 flex flex-col justify-between';
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[2/3]">
                        <img src="${IMAGE_PATH + item.poster_path}" alt="${title}" class="w-full h-full object-cover transition duration-300">
                        <span class="absolute top-2 right-2 bg-slate-900/80 text-amber-400 font-bold text-xs px-2 py-1 rounded-md backdrop-blur">
                            ★ ${rating}
                        </span>
                        ${item.adult ? '<span class="absolute top-2 left-2 bg-red-600 text-white font-bold text-[10px] px-1.5 py-0.5 rounded">+18</span>' : ''}
                    </div>
                    <div class="p-3">
                        <h3 class="font-semibold text-sm truncate text-white" title="${title}">${title}</h3>
                        <p class="text-xs text-slate-400 mt-1">${date.split('-')[0]}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Illk yuklemede trendleri getir
        fetchTrending();
    </script>
</body>
</html>
